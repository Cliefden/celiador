# Dependabot: weekly update PRs for the daemon's and the site's npm
# dependencies and for the GitHub Actions the workflows use (pinned by commit
# SHA with the version in a comment; Dependabot updates both). Minor and patch
# bumps are grouped into one PR per ecosystem; security updates always come
# on their own. Majors of the site's framework stay a deliberate move (#108).
version: 2
updates:
  - package-ecosystem: npm
    directory: /daemon
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      daemon-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "daemon"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "web"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
