name: Auto-retry deploy on SSH timeout

# Some runners can't reach the box on port 22: the deploy fails with
# "ssh-keyscan: no answer from the VPS" (the Configure SSH step) or ssh's own
# "Connection timed out", and `gh run rerun --failed` on a fresh runner works
# (#160, after Celindor's auto-retry-deploy.yml). This does that rerun:
#
# - only for a failed job whose log shows one of those messages, so a real
#   failure is never retried;
# - at most twice (run_attempt < 3), so nothing loops;
# - only while the run is still the newest of its workflow and kind: a rerun
#   deploys the run's own commit, and once a newer run of the same workflow has
#   started it would put the older commit back over it. Deploys are
#   path-filtered, so "newer" is per workflow, not main's tip.
#
# The failed attempt still mails its failure; the rerun mails its own result.
# workflow_run only fires for this file as it is on main.
on:
  workflow_run:
    workflows: ["Deploy daemon", "Deploy web"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Was the failure an SSH connection timeout?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          # The whole log of each failed job of the attempt, not just the
          # failed step: a job can log a timeout and then fail elsewhere.
          timeout_re='ssh-keyscan: no answer from the VPS|ssh: connect to host .*: (Connection|Operation) timed out|Connection timed out during banner exchange'
          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            -q '.jobs[] | select(.conclusion == "failure") | .id')"
          for job in $jobs; do
            log="$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" 2>/dev/null || true)"
            if grep -qE "$timeout_re" <<< "$log"; then
              echo "retry=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "failure is not an SSH timeout; not retrying"
          echo "retry=false" >> "$GITHUB_OUTPUT"

      - name: Is the run still the newest of its kind?
        id: current
        if: steps.check.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          # Same workflow, same event, started after this run. For pushes, the
          # same kind too: a main push (dev) or a release tag (test). Any
          # newer manual run counts, whatever its environment.
          is_tag=false
          [[ "$HEAD_BRANCH" =~ ^v[0-9] ]] && is_tag=true
          newer="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?event=$EVENT&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID and .created_at > \"$CREATED_AT\")
                   | select(\"$EVENT\" != \"push\" or (((.head_branch // \"\") | test(\"^v[0-9]\")) == $is_tag))] | length")"
          if [[ "$newer" != 0 ]]; then
            echo "::warning::not retrying: a newer run of this deploy ($EVENT) started after this one"
            echo "rerun=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rerun=true" >> "$GITHUB_OUTPUT"

      - name: Rerun failed jobs
        if: steps.current.outputs.rerun == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
