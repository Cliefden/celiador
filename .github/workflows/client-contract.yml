name: Client contract

# The daemon's client contract (packages/client): the OpenAPI spec and the
# TypeScript types generated from it (packages/client/README.md). Pull requests
# are checked once they are ready for review (a draft runs nothing). Checks:
#   - types:    the committed types match the spec and compile;
#   - coverage: every route the daemon serves under /api is in the spec (or in
#               packages/client/routes-allowlist.txt), and the spec describes
#               nothing the daemon doesn't serve;
#   - breaking: on pull requests, the spec only changed additively against the
#               base branch — released clients can't be updated in lockstep. A
#               deliberate break passes with the `api-breaking` label, and
#               scripts/release.sh then refuses anything but a MINOR bump
#               (below 1.0);
#   - release:  on a vX.Y.Z tag, the same rule against the previous tag, as a
#               backstop for a release cut without release.sh.
# oasdiff is pinned in packages/client/scripts/breaking-since.sh.
on:
  pull_request:
    # ready_for_review: a draft marked ready runs its checks;
    # labeled/unlabeled: adding or removing api-breaking re-runs them.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - packages/client/**
      - daemon/src/**
      - .github/workflows/client-contract.yml
  push:
    # Tags only (branch pushes are covered by their pull request). Path
    # filters never apply to tags: every release tag is checked.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: client-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  types:
    name: generated types up to date
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/client/package-lock.json

      - run: npm ci

      # Regenerates from openapi.yaml and fails when src/schema.ts differs,
      # then typechecks the generated file.
      - run: npm run check

  coverage:
    name: every daemon route is in the contract
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: daemon/package-lock.json

      - run: npm ci

      - run: npm run check:api-coverage

  breaking:
    name: no breaking API changes
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Breaking changes against the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
        run: |
          set +e
          packages/client/scripts/breaking-since.sh "origin/$BASE_REF"
          status=$?
          set -e
          if [ "$status" -eq 1 ] && [ "$ALLOWED" = true ]; then
            echo "::warning::Breaking API changes, allowed by the api-breaking label. The next release must be a MINOR bump (below 1.0), and CHANGELOG.md must say what clients need to do."
            exit 0
          fi
          if [ "$status" -eq 1 ]; then
            echo "::error::Breaking API changes (above). Make the change additive (packages/client/README.md), or label the PR api-breaking if it is deliberate."
          fi
          exit "$status"

  release:
    name: release tag bumps right for its API changes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Against the previous release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)"
          if [ -z "$prev" ]; then
            echo "No earlier release tag; nothing to compare."
            exit 0
          fi
          set +e
          packages/client/scripts/breaking-since.sh "$prev"
          status=$?
          set -e
          [ "$status" -le 1 ] || exit "$status"
          [ "$status" -eq 0 ] && exit 0
          IFS=. read -r pmaj pmin _ <<<"${prev#v}"
          IFS=. read -r tmaj tmin _ <<<"${TAG#v}"
          if { [ "$pmaj" = 0 ] && [ "$tmaj" = 0 ] && [ "$tmin" = "$pmin" ]; } || { [ "$pmaj" != 0 ] && [ "$tmaj" = "$pmaj" ]; }; then
            echo "::error::$TAG has breaking API changes since $prev but isn't a MINOR (below 1.0) / MAJOR bump."
            exit 1
          fi
          echo "Breaking API changes since $prev, released as $TAG: bumped correctly."
