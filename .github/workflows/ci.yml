name: CI

# Validate the daemon (daemon/): typecheck + the offline smoke test (gateway +
# session relay + server runner, no network / no real key). Runs on pull
# requests and pushes to other branches that touch the daemon; the Deploy
# workflow calls it for every push to main and every release tag, so nothing
# reaches an environment unchecked. The site builds in its own deploy; the iOS
# app in ios.yml.
on:
  pull_request:
    paths:
      - daemon/**
      - .github/workflows/ci.yml
  push:
    branches-ignore: [main]
    paths:
      - daemon/**
      - .github/workflows/ci.yml
  workflow_call:
    inputs:
      called:
        # Set by every caller (deploy.yml); never set on pull_request/push,
        # where the `inputs` context is empty.
        description: True when another workflow calls this one
        type: boolean
        default: true

# Standalone (pull_request / push to a branch): one run per PR or branch, and a
# newer push cancels the older run.
#
# Called from deploy.yml: never cancelled, and in a group of its own. Inside a
# called workflow the `github` context is the CALLER's — github.event_name is
# push or workflow_dispatch, never 'workflow_call', and github.workflow is the
# caller's name — so the old guard (`github.event_name != 'workflow_call'`)
# never matched: every deploy's CI ran with cancel-in-progress on, in the group
# "Deploy daemon-<ref>". A push-to-main deploy (group deploy-daemon-dev) and a
# dispatch of main to test (deploy-daemon-test) then shared that CI group and
# cancelled each other's CI, failing the deploy. The `called` input is the
# signal that does reach the callee.
concurrency:
  group: ${{ inputs.called && format('ci-called-{0}-{1}', github.run_id, github.run_attempt) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.called }}

defaults:
  run:
    working-directory: daemon

jobs:
  check:
    name: typecheck + smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound from package.json `engines` plus the version used in dev.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: daemon/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # The server-runner smoke clones a local repo over file:// — recent git
      # refuses that by default, so opt in explicitly for the CI runner.
      - name: Allow local-path git clones
        run: git config --global protocol.file.allow always

      - run: npm run smoke
