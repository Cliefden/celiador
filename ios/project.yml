name: Celiador
options:
  bundleIdPrefix: ai.celiador
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: XPNFDWPFAV
targets:
  Celiador:
    type: application
    platform: iOS
    sources: [Shared, Celiador]
    dependencies:
      - target: CeliadorWidgets
    info:
      path: Celiador/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: ai.celiador.companion
            CFBundleURLSchemes: [celiador]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.celiador.companion
        CODE_SIGN_ENTITLEMENTS: Celiador/Celiador.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme: {}
  CeliadorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - CeliadorWidgets
      - path: Shared/Theme.swift
      - path: Shared/WidgetShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.celiador.companion.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CeliadorWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: CeliadorWidgets/CeliadorWidgets.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    scheme: {}
