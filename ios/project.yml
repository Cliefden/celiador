name: Celiador
options:
  bundleIdPrefix: ai.celiador
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
# Three build channels pointing at the matching daemon environment (see
# daemon/ENVIRONMENTS.md). The xcconfigs define CELIADOR_DAEMON_URL +
# BUNDLE_ID_SUFFIX + APP_NAME + URL_SCHEME; targets below reference those so all
# three install side-by-side. Build staging/dev with `-configuration Staging|Dev`.
configs:
  Dev: debug
  Staging: release
  Release: release
configFiles:
  Dev: Config/Dev.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Prod.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: XPNFDWPFAV
targets:
  Celiador:
    type: application
    platform: iOS
    sources: [Shared, Celiador]
    dependencies:
      - target: CeliadorWidgets
      # CeliadorWatch dropped from v1 — re-add to ship the watchOS app.
    info:
      path: Celiador/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: $(APP_NAME)
        CELIADOR_DAEMON_URL: $(CELIADOR_DAEMON_URL)
        CELIADOR_URL_SCHEME: $(URL_SCHEME)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: ai.celiador.companion$(BUNDLE_ID_SUFFIX)
            CFBundleURLSchemes: [$(URL_SCHEME)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.celiador.companion$(BUNDLE_ID_SUFFIX)
        # Dev uses automatic signing so Xcode manages the development cert +
        # profile (App Groups + Push) for on-device runs; Staging/Release below
        # override to manual distribution signing for the App Store.
        CODE_SIGN_STYLE: Automatic
        # aps-environment: Dev keeps development; Staging/Release use production
        # (distribution profiles authorize production push only).
        CODE_SIGN_ENTITLEMENTS: Celiador/Celiador.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Staging:
          CODE_SIGN_ENTITLEMENTS: Celiador/Celiador.production.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Celiador App Store
        Release:
          CODE_SIGN_ENTITLEMENTS: Celiador/Celiador.production.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Celiador App Store
    scheme:
      # On a physical device `localhost` (the Dev xcconfig default) resolves to
      # the phone, not the Mac — so Run against the live daemon. Api.swift reads
      # CELIADOR_URL first (overrides CELIADOR_DAEMON_URL). NOTE: scheme env vars
      # apply only when launched FROM Xcode; a standalone relaunch falls back to
      # the xcconfig. To point back at a local daemon, disable this in Edit Scheme.
      environmentVariables:
        - variable: CELIADOR_URL
          value: https://celiador.ai
          isEnabled: true
  CeliadorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - CeliadorWidgets
      - path: Shared/Theme.swift
      - path: Shared/WidgetShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.celiador.companion$(BUNDLE_ID_SUFFIX).widgets
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CeliadorWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: CeliadorWidgets/CeliadorWidgets.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Staging:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Celiador Widgets App Store
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Celiador Widgets App Store
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    scheme: {}
  CeliadorWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - path: Shared/Api.swift
      - path: Shared/Models.swift
      - path: Shared/Events.swift
      - path: Shared/Theme.swift
      - path: Shared/WatchSync.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.celiador.companion$(BUNDLE_ID_SUFFIX).watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme: {}
